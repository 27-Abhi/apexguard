version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: apexguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  apexguard-api:
    build: .
    container_name: apexguard-rag-gateway
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - qdrant
    restart: always

volumes:
  qdrant_data:
